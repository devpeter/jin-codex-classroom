<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Jin的codex建站小课堂</title>
<script>
(async function(){
  try {
    const parts = await Promise.all([
      'page-a.html','page-b1.html','page-b2.html'
    ].map(u => fetch(u,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.text()})));
    document.open(); document.write(parts.join('')); document.close();
  } catch(e) {
    document.body.innerHTML='<p style="font-family:system-ui;padding:2rem">加载失败: '+e.message+'</p>';
  }
})();
</script>
</head>
<body><p style="font-family:system-ui;padding:2rem;color:#666">加载中…</p></body>
</html>
