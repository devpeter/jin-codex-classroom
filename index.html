<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Jin的codex建站小课堂</title>
<script>
(async function(){
  const [a,b] = await Promise.all([
    fetch('page-a.html').then(r=>r.text()),
    fetch('page-b.html').then(r=>r.text())
  ]);
  document.open();
  document.write(a+b);
  document.close();
})();
</script>
</head>
<body>
<p style="font-family:system-ui;padding:2rem;color:#666">加载中…</p>
</body>
</html>
